<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sendeplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F5F1;
    --surface: #FFFFFF;
    --surface-2: #F0EDE6;
    --line: #E4E1DA;
    --text: #16171A;
    --muted: #6B6D74;
    --accent: #C81A20;
    --accent-tint: rgba(200,26,32,0.08);

    --c-handball: #B9861B;
    --c-basketball: #C2571B;
    --c-volleyball: #2B6CB0;
    --c-tischtennis: #2F8F46;
    --c-hockeyd: #9B4F96;
    --c-hockeyh: #5B4B8A;
    --c-studio: #6B6D74;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-tint);}

  header{
    position:sticky; top:0; z-index:30;
    background:rgba(247,245,241,0.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:22px 24px 0;
  }
  .titlebar{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  h1{
    font-size:36px; margin:0; line-height:1;
    font-family:'Barlow Condensed', sans-serif; font-weight:700;
    letter-spacing:0.01em;
  }
  .subtitle{color:var(--muted); font-size:14px; margin-top:5px;}
  .count{color:var(--muted); font-size:13px; white-space:nowrap;}
  .count b{color:var(--text); font-weight:600;}

  /* Tabs */
  .tabs{display:flex; gap:2px; margin-top:18px; overflow-x:auto; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    font-family:'Barlow Condensed', sans-serif; font-weight:600; font-size:16px;
    padding:10px 16px; color:var(--muted); background:transparent; border:none;
    cursor:pointer; white-space:nowrap; position:relative; letter-spacing:0.01em;
  }
  .tab.active{color:var(--text);}
  .tab.active::after{
    content:''; position:absolute; left:14px; right:14px; bottom:-1px; height:3px; background:var(--accent);
    border-radius:2px 2px 0 0;
  }
  .tab .n{color:var(--muted); font-size:12px; font-family:'Inter'; font-weight:500; margin-left:4px;}

  .controls{padding:14px 0 16px; display:flex; flex-direction:column; gap:10px;}
  .row-controls{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}

  .search{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:9px 12px; color:var(--text); font-size:14px; font-family:inherit;
    width:100%; max-width:260px;
  }
  .search::placeholder{color:var(--muted);}
  .search:focus{outline:none; border-color:var(--accent);}

  .left-controls{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start;}

  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    display:flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:999px; font-size:13px; font-weight:500;
    background:var(--surface); border:1px solid var(--line); color:var(--muted);
    cursor:pointer; user-select:none; transition:all .15s ease;
  }
  .chip .dot{width:8px; height:8px; border-radius:50%; background:currentColor;}
  .chip.active{color:#fff; border-color:transparent;}
  .chip:hover{border-color:#c9c6bd;}

  .status-toggle{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:3px; gap:2px;}
  .status-toggle button, .simple-toggle button{
    background:transparent; border:none; color:var(--muted); font-family:inherit; font-size:13px; font-weight:500;
    padding:6px 14px; border-radius:6px; cursor:pointer;
  }
  .status-toggle button.active, .simple-toggle button.active{background:var(--accent); color:#fff;}
  .simple-toggle{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:3px; gap:2px;}

  /* Team multi-select */
  .team-filter{position:relative;}
  .team-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:8px 14px; font-size:13px; font-weight:500; color:var(--text); cursor:pointer; font-family:inherit;
  }
  .team-btn.has-selection{border-color:var(--accent); color:var(--accent);}
  .team-btn .count-badge{
    background:var(--accent); color:#fff; font-size:11px; font-weight:700;
    padding:1px 6px; border-radius:999px;
  }
  .team-panel{
    display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:40;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 12px 32px rgba(20,18,14,0.14);
    width:280px; max-height:360px; overflow:hidden; flex-direction:column;
  }
  .team-panel.open{display:flex;}
  .team-search{
    border:none; border-bottom:1px solid var(--line); padding:12px 14px; font-family:inherit; font-size:13px;
    background:transparent; color:var(--text);
  }
  .team-search:focus{outline:none;}
  .team-list{overflow-y:auto; padding:6px 0;}
  .team-opt{
    display:flex; align-items:center; gap:10px; padding:7px 14px; font-size:13.5px; cursor:pointer;
  }
  .team-opt:hover{background:var(--surface-2);}
  .team-opt input{accent-color:var(--accent); width:15px; height:15px;}
  .team-panel-footer{
    border-top:1px solid var(--line); padding:8px 14px; display:flex; justify-content:space-between;
  }
  .team-panel-footer button{
    background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; padding:4px 0;
  }
  .team-chips-active{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;}
  .team-chip-active{
    display:flex; align-items:center; gap:6px; background:var(--accent-tint); color:var(--accent);
    border-radius:999px; padding:4px 6px 4px 12px; font-size:12.5px; font-weight:600;
  }
  .team-chip-active button{
    background:none; border:none; color:var(--accent); cursor:pointer; font-size:14px; line-height:1; padding:2px;
    font-family:inherit;
  }

  main{max-width:1040px; margin:0 auto; padding:0 24px 60px;}

  .group-header{
    background:var(--bg);
    padding:20px 0 8px;
    font-family:'Barlow Condensed', sans-serif;
    font-size:15px; font-weight:600; letter-spacing:0.04em; color:var(--muted);
    border-bottom:1px solid var(--line);
    margin-bottom:2px;
  }
  .group-header span{color:var(--text);}

  .item{
    display:grid;
    grid-template-columns:56px 60px 130px 1fr 78px;
    align-items:center;
    gap:14px;
    padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .item:last-child{border-bottom:none;}
  .item.played{opacity:0.5;}

  .datebox{font-family:'Barlow Condensed', sans-serif; line-height:1; text-align:center;}
  .datebox .wd{font-size:11px; color:var(--muted); font-weight:600; letter-spacing:0.03em;}
  .datebox .dm{font-size:19px; font-weight:700; color:var(--text);}

  .time{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums;}

  .tag{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; padding:4px 10px; border-radius:6px;
    color:#fff; white-space:nowrap; width:fit-content;
  }

  .matchup{font-size:14.5px; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .matchup .vs{color:var(--muted); margin:0 2px; font-weight:400;}
  .matchup b{font-weight:600;}
  .star{color:var(--accent); font-size:13px;}
  .played-mark{font-size:10.5px; color:#3F8F52; font-weight:600;}

  .badge{
    font-size:11px; font-weight:700; letter-spacing:0.04em;
    padding:3px 9px; border-radius:999px; text-align:center; width:fit-content; justify-self:end;
  }
  .badge.live{background:rgba(200,26,32,0.09); color:var(--accent); border:1px solid rgba(200,26,32,0.28);}
  .badge.relive{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .badge.picked{background:rgba(200,26,32,0.09); color:var(--accent); border:1px solid rgba(200,26,32,0.28);}
  .badge.notpicked{background:transparent; color:var(--muted); border:1px solid var(--line);}

  .empty{padding:60px 0; text-align:center; color:var(--muted); font-size:14px;}

  footer{max-width:1040px; margin:0 auto; padding:8px 24px 50px; color:var(--muted); font-size:12px; line-height:1.6;}
  footer .legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:10px;}
  footer .legend span{display:inline-flex; align-items:center; gap:6px;}
  footer .legend .sw{width:9px; height:9px; border-radius:3px; display:inline-block;}

  @media (max-width:640px){
    header{padding:16px 16px 0;}
    main{padding:0 12px 50px;}
    h1{font-size:28px;}
    .item{
      grid-template-columns:44px 1fr auto;
      grid-template-areas:"date matchup badge" "date tag time";
      row-gap:4px;
    }
    .item .datebox{grid-area:date;}
    .item .matchup{grid-area:matchup;}
    .item .badge{grid-area:badge;}
    .item .tag{grid-area:tag;}
    .item .time{grid-area:time; justify-self:end; align-self:end;}
  }
</style>
</head>

</header>

<main id="main"></main>

const SPORT_META = {
  'Handball':          {color:'var(--c-handball)'},
  'Basketball':        {color:'var(--c-basketball)'},
  'Volleyball Herren': {color:'var(--c-volleyball)', label:'Volleyball'},
  'Tischtennis':       {color:'var(--c-tischtennis)'},
  'Hockey Damen':      {color:'var(--c-hockeyd)'},
  'Hockey Herren':     {color:'var(--c-hockeyh)'},
  'Studio':            {color:'var(--c-studio)'},
};

const TABS = [
  {id:'sendeplan', label:'Sendeplan', sport:null},
  {id:'handball',    label:'Handball',    sport:'Handball'},
  {id:'basketball',  label:'Basketball',  sport:'Basketball'},
  {id:'volleyball',  label:'Volleyball',  sport:'Volleyball Herren'},
  {id:'tischtennis', label:'Tischtennis', sport:'Tischtennis'},
  {id:'hockeyd',     label:'Hockey Damen',  sport:'Hockey Damen'},
  {id:'hockeyh',     label:'Hockey Herren', sport:'Hockey Herren'},
];

let activeTab = 'sendeplan';
let activeSports = new Set(Object.keys(SPORT_META));
let statusFilter = 'all';
let pickedFilter = 'all'; // all | picked
let selectedTeams = new Set();

const WD_ABBR = {'Montag':'Mo','Dienstag':'Di','Mittwoch':'Mi','Donnerstag':'Do','Freitag':'Fr','Samstag':'Sa','Sonntag':'So',
                 'Mo':'Mo','Di':'Di','Mi':'Mi','Do':'Do','Fr':'Fr','Sa':'Sa','So':'So','':''};

function tagColor(sport){ return (SPORT_META[sport]||{}).color || '#888'; }
function tagLabel(sport){ return (SPORT_META[sport]||{}).label || sport; }

// ---------- Tabs ----------
const tabsEl = document.getElementById('tabs');
TABS.forEach(t=>{
  const btn = document.createElement('button');
  btn.className = 'tab' + (t.id===activeTab ? ' active' : '');
  const n = t.id==='sendeplan' ? SENDEPLAN.length : LEAGUES[t.id].length;
  btn.innerHTML = `${t.label}<span class="n">${n}</span>`;
  btn.addEventListener('click', ()=>{ switchTab(t.id); });
  btn.dataset.tab = t.id;
  tabsEl.appendChild(btn);
});

function switchTab(id){
  activeTab = id;
  selectedTeams = new Set();
  statusFilter = 'all';
  pickedFilter = 'all';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  buildRightControls();
  buildChips();
  buildTeamList();
  updateHeaderText();
  render();
}

function updateHeaderText(){
  const title = document.getElementById('pageTitle');
  const sub = document.getElementById('pageSubtitle');
  if(activeTab==='sendeplan'){
    title.textContent = 'Sendeplan';
    sub.textContent = '30. August – 30. Dezember 2026 · Handball, Basketball, Volleyball, Tischtennis, Feldhockey';
  } else {
    const t = TABS.find(x=>x.id===activeTab);
    title.textContent = t.label + ' – Gesamtspielplan';
    sub.textContent = 'Alle Partien der Saison 2026/27 · rot markiert = für den Sendeplan ausgewählt';
  }
}

// ---------- Sport chips (nur Sendeplan) ----------
const chipsEl = document.getElementById('chips');
function buildChips(){
  chipsEl.innerHTML = '';
  if(activeTab!=='sendeplan'){ chipsEl.style.display='none'; return; }
  chipsEl.style.display='flex';
  activeSports = new Set(Object.keys(SPORT_META));
  Object.entries(SPORT_META).forEach(([sport, meta])=>{
    const chip = document.createElement('div');
    chip.className = 'chip active';
    chip.style.background = meta.color;
    chip.style.borderColor = meta.color;
    chip.innerHTML = `${meta.label || sport}`;
    chip.addEventListener('click', ()=>{
      if(activeSports.has(sport)){
        activeSports.delete(sport);
        chip.classList.remove('active');
        chip.style.background=''; chip.style.color=''; chip.style.borderColor='var(--line)';
      } else {
        activeSports.add(sport);
        chip.classList.add('active');
        chip.style.background=meta.color; chip.style.color='#fff'; chip.style.borderColor=meta.color;
      }
      render();
    });
    chipsEl.appendChild(chip);
  });
}

// ---------- Right-side controls (Status / Nur gepickt) ----------
const rightControls = document.getElementById('rightControls');
function buildRightControls(){
  rightControls.innerHTML = '';
  if(activeTab==='sendeplan'){
    const wrap = document.createElement('div');
    wrap.className = 'status-toggle';
    wrap.innerHTML = `
      <button data-v="all" class="active">Alle</button>
      <button data-v="Live">Live</button>
      <button data-v="Re-Live">Re-Live</button>`;
    wrap.addEventListener('click', (e)=>{
      const b = e.target.closest('button'); if(!b) return;
      wrap.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      statusFilter = b.dataset.v;
      render();
    });
    rightControls.appendChild(wrap);
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'simple-toggle';
    wrap.innerHTML = `
      <button data-v="all" class="active">Alle Spiele</button>
      <button data-v="picked">Nur im Sendeplan</button>`;
    wrap.addEventListener('click', (e)=>{
      const b = e.target.closest('button'); if(!b) return;
      wrap.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      pickedFilter = b.dataset.v;
      render();
    });
    rightControls.appendChild(wrap);
  }
}

// ---------- Team multi-select ----------
const teamBtn = document.getElementById('teamBtn');
const teamPanel = document.getElementById('teamPanel');
const teamList = document.getElementById('teamList');
const teamSearch = document.getElementById('teamSearch');
const teamChipsActive = document.getElementById('teamChipsActive');

function currentDataset(){
  if(activeTab==='sendeplan') return SENDEPLAN;
  return LEAGUES[activeTab];
}

function allTeamsForContext(){
  const set = new Set();
  currentDataset().forEach(e=>{ if(e.heim) set.add(e.heim); if(e.gast) set.add(e.gast); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'de'));
}

function buildTeamList(){
  const teams = allTeamsForContext();
  teamList.innerHTML = '';
  teams.forEach(team=>{
    const row = document.createElement('label');
    row.className = 'team-opt';
    row.innerHTML = `<input type="checkbox" value="${team}"> ${team}`;
    row.querySelector('input').addEventListener('change', (e)=>{
      if(e.target.checked) selectedTeams.add(team); else selectedTeams.delete(team);
      updateTeamUI();
      render();
    });
    teamList.appendChild(row);
  });
}

teamSearch.addEventListener('input', ()=>{
  const q = teamSearch.value.trim().toLowerCase();
  teamList.querySelectorAll('.team-opt').forEach(row=>{
    row.style.display = row.textContent.toLowerCase().includes(q) ? 'flex' : 'none';
  });
});

teamBtn.addEventListener('click', ()=>{ teamPanel.classList.toggle('open'); });
document.getElementById('teamDone').addEventListener('click', ()=> teamPanel.classList.remove('open'));
document.getElementById('teamClear').addEventListener('click', ()=>{
  selectedTeams = new Set();
  teamList.querySelectorAll('input').forEach(i=>i.checked=false);
  updateTeamUI(); render();
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.team-filter')) teamPanel.classList.remove('open');
});

function updateTeamUI(){
  const n = selectedTeams.size;
  document.getElementById('teamCountBadge').textContent = n>0 ? n : '';
  teamBtn.classList.toggle('has-selection', n>0);
  teamChipsActive.innerHTML = '';
  selectedTeams.forEach(team=>{
    const chip = document.createElement('div');
    chip.className = 'team-chip-active';
    chip.innerHTML = `${team} <button>&times;</button>`;
    chip.querySelector('button').addEventListener('click', ()=>{
      selectedTeams.delete(team);
      const cb = teamList.querySelector(`input[value="${CSS.escape(team)}"]`);
      if(cb) cb.checked = false;
      updateTeamUI(); render();
    });
    teamChipsActive.appendChild(chip);
  });
}

document.getElementById('search').addEventListener('input', render);

// ---------- Legend ----------
const legendEl = document.getElementById('legend');
Object.entries(SPORT_META).forEach(([sport, meta])=>{
  const s = document.createElement('span');
  s.innerHTML = `<span class="sw" style="background:${meta.color}"></span>${meta.label || sport}`;
  legendEl.appendChild(s);
});

// ---------- Render ----------
function groupLabelSendeplan(e){
  const [wk, yr] = e.week.replace('KW','').split('/');
  return `KW ${wk} / ${yr}`;
}
function groupLabelLeague(e){
  if(e.date === '9999-99-99') return 'Termin offen';
  const [y,m] = e.date.split('-');
  const MONTHS = ['','Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  return `${MONTHS[parseInt(m,10)]} ${y}`;
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const main = document.getElementById('main');
  main.innerHTML = '';

  const isSendeplan = activeTab === 'sendeplan';
  const data = currentDataset();

  const filtered = data.filter(e=>{
    if(isSendeplan){
      if(!activeSports.has(e.league)) return false;
      if(statusFilter !== 'all' && e.status !== statusFilter) return false;
    } else {
      if(pickedFilter === 'picked' && !e.picked) return false;
    }
    if(selectedTeams.size > 0){
      if(!selectedTeams.has(e.heim) && !selectedTeams.has(e.gast)) return false;
    }
    if(q){
      const hay = `${e.heim} ${e.gast||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('countShown').textContent = filtered.length;
  document.getElementById('countTotal').textContent = data.length;

  if(filtered.length === 0){
    main.innerHTML = '<div class="empty">Keine Treffer für diese Auswahl. Filter anpassen oder Suche leeren.</div>';
    return;
  }

  let currentGroup = null;
  filtered.forEach(e=>{
    const groupKey = isSendeplan ? e.week : groupLabelLeague(e);
    if(groupKey !== currentGroup){
      currentGroup = groupKey;
      const gh = document.createElement('div');
      gh.className = 'group-header';
      gh.innerHTML = `<span>${isSendeplan ? groupLabelSendeplan(e) : groupKey}</span>`;
      main.appendChild(gh);
    }
    const sport = isSendeplan ? e.league : TABS.find(t=>t.id===activeTab).sport;
    const item = document.createElement('div');
    item.className = 'item' + (e.played ? ' played' : '');

    const [dd,mm] = (e.date_fmt||'').split('.');
    const dateHtml = e.date_fmt === 'Termin folgt'
      ? `<div class="wd">–</div><div class="dm" style="font-size:12px;">tba</div>`
      : `<div class="wd">${WD_ABBR[e.weekday]||''}</div><div class="dm">${dd}.${mm}.</div>`;

    const rightBadge = isSendeplan
      ? `<div class="badge ${e.status==='Live' ? 'live':'relive'}">${e.status==='Live'?'LIVE':'RE-LIVE'}</div>`
      : (e.picked ? `<div class="badge picked">SENDEPLAN</div>` : '');

    item.innerHTML = `
      <div class="datebox">${dateHtml}</div>
      <div class="time">${(e.uhrzeit||'').replace(' Uhr','')}</div>
      <div class="tag" style="background:${tagColor(sport)}">${tagLabel(sport)}</div>
      <div class="matchup">
        ${!isSendeplan && e.picked ? '<span class="star">★</span>' : ''}
        <b>${e.heim}</b>${e.gast ? `<span class="vs">–</span>${e.gast}` : ''}
        ${e.played ? '<span class="played-mark">gelaufen</span>' : ''}
      </div>
      ${rightBadge}
    `;
    main.appendChild(item);
  });
}

// ---------- Init ----------
buildRightControls();
buildChips();
buildTeamList();
updateTeamUI();
render();
</script>
