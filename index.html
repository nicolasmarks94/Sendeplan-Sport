<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sendeplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F5F1;
    --surface: #FFFFFF;
    --surface-2: #F0EDE6;
    --line: #E4E1DA;
    --text: #16171A;
    --muted: #6B6D74;
    --accent: #C81A20;
    --accent-tint: rgba(200,26,32,0.08);

    --c-handball: #B9861B;
    --c-basketball: #C2571B;
    --c-volleyball: #2B6CB0;
    --c-tischtennis: #2F8F46;
    --c-hockeyd: #9B4F96;
    --c-hockeyh: #5B4B8A;
    --c-studio: #6B6D74;
    --played-bg: #E4F0E2;
    --container-w: 1280px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-tint);}

  header{
    position:sticky; top:0; z-index:30;
    background:rgba(247,245,241,0.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:22px 24px 0;
  }
  .header-inner{max-width:var(--container-w); margin:0 auto;}
  .titlebar{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .header-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .edit-toggle, .download-btn{
    font-family:'Inter', sans-serif; font-size:12.5px; font-weight:600;
    padding:7px 13px; border-radius:8px; cursor:pointer; white-space:nowrap;
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
  }
  .edit-toggle.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .download-btn{background:var(--text); color:var(--bg); border-color:var(--text);}
  .download-btn:hover{opacity:0.85;}
  h1{
    font-size:40px; margin:0; line-height:1;
    font-family:'Barlow Condensed', sans-serif; font-weight:700;
    letter-spacing:0.01em;
  }
  .subtitle{color:var(--muted); font-size:15px; margin-top:5px;}
  .count{color:var(--muted); font-size:13px; white-space:nowrap;}
  .count b{color:var(--text); font-weight:600;}

  /* Tabs */
  .tabs{display:flex; gap:2px; margin-top:18px; overflow-x:auto; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    font-family:'Barlow Condensed', sans-serif; font-weight:600; font-size:16px;
    padding:10px 16px; color:var(--muted); background:transparent; border:none;
    cursor:pointer; white-space:nowrap; position:relative; letter-spacing:0.01em;
  }
  .tab.active{color:var(--text);}
  .tab.active::after{
    content:''; position:absolute; left:14px; right:14px; bottom:-1px; height:3px; background:var(--accent);
    border-radius:2px 2px 0 0;
  }
  .tab .n{color:var(--muted); font-size:12px; font-family:'Inter'; font-weight:500; margin-left:4px;}

  .controls{padding:14px 0 16px; display:flex; flex-direction:column; gap:10px;}
  .row-controls{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .right-group{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

  .search{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:9px 12px; color:var(--text); font-size:14px; font-family:inherit;
    width:100%; max-width:260px;
  }
  .search::placeholder{color:var(--muted);}
  .search:focus{outline:none; border-color:var(--accent);}

  .left-controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

  .switch-control{display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;}
  .switch{position:relative; display:inline-block; width:34px; height:20px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switch-slider{
    position:absolute; inset:0; background:var(--line); border-radius:999px;
    transition:background .15s ease;
  }
  .switch-slider::before{
    content:''; position:absolute; width:16px; height:16px; left:2px; top:2px;
    background:#fff; border-radius:50%; transition:transform .15s ease;
    box-shadow:0 1px 2px rgba(0,0,0,0.2);
  }
  .switch input:checked + .switch-slider{background:var(--accent);}
  .switch input:checked + .switch-slider::before{transform:translateX(14px);}
  .switch-label{font-size:13px; color:var(--muted); font-weight:500;}

  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    display:flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:999px; font-size:13px; font-weight:500;
    background:var(--surface); border:1px solid var(--line); color:var(--muted);
    cursor:pointer; user-select:none; transition:all .15s ease;
  }
  .chip .dot{width:8px; height:8px; border-radius:50%; background:currentColor;}
  .chip.active{color:#fff; border-color:transparent;}
  .chip:hover{border-color:#c9c6bd;}

  .status-toggle{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:3px; gap:2px;}
  .status-toggle button, .simple-toggle button{
    background:transparent; border:none; color:var(--muted); font-family:inherit; font-size:13px; font-weight:500;
    padding:6px 14px; border-radius:6px; cursor:pointer;
  }
  .status-toggle button.active, .simple-toggle button.active{background:var(--accent); color:#fff;}
  .simple-toggle{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:3px; gap:2px;}

  /* Team multi-select */
  .team-filter{position:relative;}
  .team-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:8px 14px; font-size:13px; font-weight:500; color:var(--text); cursor:pointer; font-family:inherit;
  }
  .team-btn.has-selection{border-color:var(--accent); color:var(--accent);}
  .team-btn .count-badge{
    background:var(--accent); color:#fff; font-size:11px; font-weight:700;
    padding:1px 6px; border-radius:999px;
  }
  .team-panel{
    display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:40;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 12px 32px rgba(20,18,14,0.14);
    width:280px; max-height:360px; overflow:hidden; flex-direction:column;
  }
  .team-panel.open{display:flex;}
  .team-search{
    border:none; border-bottom:1px solid var(--line); padding:12px 14px; font-family:inherit; font-size:13px;
    background:transparent; color:var(--text);
  }
  .team-search:focus{outline:none;}
  .team-list{overflow-y:auto; padding:6px 0;}
  .team-opt{
    display:flex; align-items:center; gap:10px; padding:7px 14px; font-size:13.5px; cursor:pointer;
  }
  .team-opt:hover{background:var(--surface-2);}
  .team-opt input{accent-color:var(--accent); width:15px; height:15px;}
  .team-panel-footer{
    border-top:1px solid var(--line); padding:8px 14px; display:flex; justify-content:space-between;
  }
  .team-panel-footer button{
    background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; padding:4px 0;
  }
  .team-chips-active{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;}
  .team-chip-active{
    display:flex; align-items:center; gap:6px; background:var(--accent-tint); color:var(--accent);
    border-radius:999px; padding:4px 6px 4px 12px; font-size:12.5px; font-weight:600;
  }
  .team-chip-active button{
    background:none; border:none; color:var(--accent); cursor:pointer; font-size:14px; line-height:1; padding:2px;
    font-family:inherit;
  }

  main{max-width:var(--container-w); margin:0 auto; padding:0 24px 60px;}

  .group-header{
    background:var(--bg);
    padding:26px 0 10px;
    font-family:'Barlow Condensed', sans-serif;
    font-size:17px; font-weight:600; letter-spacing:0.04em; color:var(--muted);
    border-bottom:1px solid var(--line);
    margin-bottom:2px;
  }
  .group-header span{color:var(--text);}

  .item{
    display:grid;
    grid-template-columns:64px 68px 150px 1fr 88px 108px 26px;
    align-items:center;
    gap:16px;
    padding:15px 0;
    border-bottom:1px solid var(--line);
  }
  .item:last-child{border-bottom:none;}
  .item.played{background:var(--played-bg);}
  .item.played .tag{opacity:0.85;}

  .datebox{font-family:'Barlow Condensed', sans-serif; line-height:1; text-align:center;}
  .datebox .wd{font-size:12px; color:var(--muted); font-weight:600; letter-spacing:0.03em;}
  .datebox .dm{font-size:22px; font-weight:700; color:var(--text);}

  .time{font-size:14.5px; color:var(--muted); font-variant-numeric:tabular-nums;}

  .tag{
    display:inline-flex; align-items:center; gap:8px;
    font-size:13.5px; font-weight:600;
    white-space:nowrap; width:fit-content;
  }
  .tag .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .tag .logo{height:26px; width:auto; max-width:64px; object-fit:contain; flex-shrink:0; border-radius:4px;}
  .tag .logo.hockey-wrap{position:relative; height:18px; display:inline-flex; align-items:center;}
  .tag .logo.hockey-wrap img{height:18px; width:auto;}
  .tag .letter-badge{
    position:absolute; right:-4px; bottom:-4px;
    background:var(--text); color:var(--bg);
    font-family:'Barlow Condensed'; font-weight:700; font-size:9px;
    width:13px; height:13px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--bg);
  }

  .ausspielung-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .aw-chip{
    display:flex; align-items:center; justify-content:center;
    padding:7px 12px; border-radius:999px;
    background:var(--surface); border:1px solid var(--line);
    cursor:pointer; transition:all .15s ease; opacity:0.4;
  }
  .aw-chip.active{opacity:1; border-color:#c9c6bd; background:var(--surface-2);}
  .aw-chip img{height:16px; width:auto; max-width:52px; object-fit:contain; display:block;}

  .matchup{font-size:16.5px; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .matchup .vs{color:var(--muted); margin:0 2px; font-weight:400;}
  .matchup b{font-weight:600;}
  .star{color:var(--accent); font-size:13px;}
  .played-mark{font-size:10.5px; color:#3F8F52; font-weight:600;}
  .result{
    font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:14px;
    color:var(--text); background:var(--surface-2); border:1px solid var(--line);
    padding:1px 8px; border-radius:5px;
  }

  .badge{
    font-size:12px; font-weight:700; letter-spacing:0.04em;
    padding:3px 9px; border-radius:999px; text-align:center; width:fit-content; justify-self:end;
  }
  .badge.live{background:rgba(200,26,32,0.09); color:var(--accent); border:1px solid rgba(200,26,32,0.28);}
  .badge.relive{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .badge.picked{background:rgba(200,26,32,0.09); color:var(--accent); border:1px solid rgba(200,26,32,0.28);}
  .badge.notpicked{background:transparent; color:var(--muted); border:1px solid var(--line);}

  .row-channels{display:flex; gap:5px; align-items:center; justify-self:end;}
  .row-channels img{height:15px; width:auto; max-width:36px; object-fit:contain;}

  .empty{padding:60px 0; text-align:center; color:var(--muted); font-size:14px;}

  /* Bearbeiten-Modus */
  .item.editable{cursor:pointer;}
  .item.editable:hover{background:var(--surface-2);}
  .edit-pencil{
    font-size:14px; color:var(--muted); justify-self:end; padding:0 4px;
    opacity:0; transition:opacity .15s ease;
  }
  .item.editable:hover .edit-pencil{opacity:1;}
  .edit-form{
    grid-column:1 / -1;
    display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    padding:14px; margin:4px 0;
  }
  .edit-field{display:flex; flex-direction:column; gap:4px;}
  .edit-field label{font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.03em;}
  .edit-field input, .edit-field select{
    font-family:'Inter', sans-serif; font-size:13.5px; padding:7px 9px;
    border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--text);
  }
  .edit-actions{grid-column:1 / -1; display:flex; justify-content:flex-end; gap:8px; margin-top:2px;}
  .edit-actions button{
    font-family:'Inter', sans-serif; font-size:13px; font-weight:600; padding:7px 16px;
    border-radius:7px; cursor:pointer; border:1px solid var(--line);
  }
  .edit-save{background:var(--accent); color:#fff; border-color:var(--accent) !important;}
  .edit-delete{background:transparent; color:var(--accent); border-color:rgba(200,26,32,0.35) !important;}
  .edit-cancel{background:var(--surface); color:var(--muted);}

  footer{max-width:var(--container-w); margin:0 auto; padding:8px 24px 50px; color:var(--muted); font-size:12px; line-height:1.6;}
  footer .legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:10px;}
  footer .legend span{display:inline-flex; align-items:center; gap:6px;}
  footer .legend .sw{width:9px; height:9px; border-radius:3px; display:inline-block;}

  @media (max-width:640px){
    header{padding:16px 16px 0;}
    main{padding:0 12px 50px;}
    h1{font-size:28px;}
    .item{
      grid-template-columns:44px 1fr auto;
      grid-template-areas:"date matchup badge" "date tag time" "date channels channels";
      row-gap:4px;
    }
    .item .datebox{grid-area:date;}
    .item .matchup{grid-area:matchup;}
    .item .badge{grid-area:badge;}
    .item .tag{grid-area:tag;}
    .item .time{grid-area:time; justify-self:end; align-self:end;}
    .item .row-channels{grid-area:channels; justify-self:end; margin-top:2px;}
    .edit-pencil{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
  <div class="titlebar">
    <div>
      <h1 id="pageTitle">Sendeplan</h1>
      <div class="subtitle" id="pageSubtitle">30. August – 30. Dezember 2026 · Handball, Basketball, Volleyball, Tischtennis, Feldhockey</div>
    </div>
    <div class="header-right">
      <button class="edit-toggle" id="editToggle" style="display:none;">✎ Bearbeiten</button>
      <button class="download-btn" id="downloadBtn" style="display:none;">⭳ Datei herunterladen</button>
      <div class="count"><b id="countShown">–</b> von <b id="countTotal">–</b></div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="controls">
    <div class="row-controls">
      <div class="left-controls">
        <input class="search" id="search" type="text" placeholder="Suchen…">
        <div class="team-filter">
          <button class="team-btn" id="teamBtn">Teams <span id="teamCountBadge"></span></button>
          <div class="team-panel" id="teamPanel">
            <input class="team-search" id="teamSearch" placeholder="Team suchen…">
            <div class="team-list" id="teamList"></div>
            <div class="team-panel-footer">
              <button id="teamClear">Zurücksetzen</button>
              <button id="teamDone">Fertig</button>
            </div>
          </div>
        </div>
        <label class="switch-control">
          <span class="switch"><input type="checkbox" id="hidePlayed"><span class="switch-slider"></span></span>
          <span class="switch-label">Gelaufene ausblenden</span>
        </label>
      </div>
      <div class="right-group">
        <div id="rightControls"></div>
        <div class="ausspielung-row" id="ausspielungRow"></div>
      </div>
    </div>
    <div class="team-chips-active" id="teamChipsActive"></div>
    <div class="chips" id="chips"></div>
  </div>
  </div>
</header>

<main id="main"></main>

<footer>
  <div id="footNote">Grün hinterlegt = bereits gelaufene Übertragung.</div>
  <div>Stand: 07.09.2026</div>
  <div class="legend" id="legend"></div>
</footer>

// "Gelaufen" wird live anhand des tatsaechlichen Geraetedatums berechnet - nie mehr
// statisch beim Bauen der Datei festgelegt. Funktioniert dadurch automatisch fuer immer,
// auch ohne dass die Datei jemals wieder aktualisiert werden muss.
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const TODAY_ISO = todayISO();
function isPlayed(dateStr){
  return dateStr < TODAY_ISO;
}

function tagColor(sport){ return (SPORT_META[sport]||{}).color || '#888'; }
function tagLabel(sport){ return (SPORT_META[sport]||{}).label || sport; }
const STUDIO_SHOW_META = {
  'Lothar legt los': {logo: LOGOS.lothar},
  'Lage der Liga': {logo: LOGOS.lage},
  'Reif ist Live': {logo: LOGOS.reif},
};

function tagInnerHtml(sport, showName){
  const meta = SPORT_META[sport] || {};
  const showMeta = (sport === 'Studio' && showName) ? STUDIO_SHOW_META[showName] : null;
  const dot = `<span class="dot" style="background:${meta.color||'#888'}"></span>`;
  let logoHtml = '';
  if(showMeta && showMeta.logo){
    logoHtml = `<img class="logo" src="${showMeta.logo}" alt="">`;
  } else if(meta.logo && meta.letter){
    logoHtml = `<span class="logo hockey-wrap"><img src="${meta.logo}" alt=""><span class="letter-badge">${meta.letter}</span></span>`;
  } else if(meta.logo){
    logoHtml = `<img class="logo" src="${meta.logo}" alt="">`;
  }
  const label = `<span style="color:${meta.color||'inherit'}">${meta.label || sport}</span>`;
  return dot + logoHtml + label;
}

// ---------- Tabs ----------
const tabsEl = document.getElementById('tabs');
TABS.forEach(t=>{
  const btn = document.createElement('button');
  btn.className = 'tab' + (t.id===activeTab ? ' active' : '');
  const n = t.id==='sendeplan' ? SENDEPLAN.length : LEAGUES[t.id].length;
  btn.innerHTML = `${t.label}<span class="n">${n}</span>`;
  btn.addEventListener('click', ()=>{ switchTab(t.id); });
  btn.dataset.tab = t.id;
  tabsEl.appendChild(btn);
});

function switchTab(id){
  activeTab = id;
  selectedTeams = new Set();
  statusFilter = 'all';
  pickedFilter = 'all';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  buildRightControls();
  buildChips();
  buildAusspielungRow();
  buildTeamList();
  updateHeaderText();
  render();
}

function updateHeaderText(){
  const title = document.getElementById('pageTitle');
  const sub = document.getElementById('pageSubtitle');
  if(activeTab==='sendeplan'){
    title.textContent = 'Sendeplan';
    sub.textContent = '30. August – 30. Dezember 2026 · Handball, Basketball, Volleyball, Tischtennis, Feldhockey';
  } else {
    const t = TABS.find(x=>x.id===activeTab);
    title.textContent = t.label + ' – Gesamtspielplan';
    sub.textContent = 'Alle Partien der Saison 2026/27 · rot markiert = für den Sendeplan ausgewählt';
  }
}

// ---------- Sport chips (nur Sendeplan) ----------
const chipsEl = document.getElementById('chips');
function buildChips(){
  chipsEl.innerHTML = '';
  if(activeTab!=='sendeplan'){ chipsEl.style.display='none'; return; }
  chipsEl.style.display='flex';
  activeSports = new Set(Object.keys(SPORT_META)); // Startzustand: alles sichtbar
  const chipEls = {};
  Object.entries(SPORT_META).forEach(([sport, meta])=>{
    const chip = document.createElement('div');
    chip.className = 'chip active';
    chip.style.background = meta.color;
    chip.style.borderColor = meta.color;
    chip.innerHTML = `${meta.label || sport}`;
    chipEls[sport] = chip;

    chip.addEventListener('click', ()=>{
      const allKeys = Object.keys(SPORT_META);
      const isAllState = activeSports.size === allKeys.length;
      if(isAllState){
        // aus dem "Alle"-Zustand heraus: nur diese Sportart isolieren
        activeSports = new Set([sport]);
      } else {
        // bereits eine Teilauswahl aktiv: diese Sportart dazu- bzw. abwaehlen
        if(activeSports.has(sport)) activeSports.delete(sport);
        else activeSports.add(sport);
        // Auswahl komplett geleert -> zurueck zu "Alle"
        if(activeSports.size === 0) activeSports = new Set(allKeys);
      }
      Object.entries(SPORT_META).forEach(([s, m])=>{
        const c = chipEls[s];
        if(activeSports.has(s)){
          c.classList.add('active');
          c.style.background = m.color; c.style.color = '#fff'; c.style.borderColor = m.color;
        } else {
          c.classList.remove('active');
          c.style.background = ''; c.style.color = ''; c.style.borderColor = 'var(--line)';
        }
      });
      render();
    });
    chipsEl.appendChild(chip);
  });
}

const ausspielungRowEl = document.getElementById('ausspielungRow');
function buildAusspielungRow(){
  ausspielungRowEl.innerHTML = '';
  if(activeTab!=='sendeplan'){ ausspielungRowEl.style.display='none'; return; }
  ausspielungRowEl.style.display='flex';
  activeChannels = new Set(Object.keys(AUSSPIELUNG_META)); // Startzustand: alles sichtbar
  const chipEls = {};
  Object.entries(AUSSPIELUNG_META).forEach(([ch, meta])=>{
    const chip = document.createElement('div');
    chip.className = 'aw-chip active';
    chip.innerHTML = `<img src="${meta.logo}" alt="${ch}">`;
    chipEls[ch] = chip;

    chip.addEventListener('click', ()=>{
      const allKeys = Object.keys(AUSSPIELUNG_META);
      const isAllState = activeChannels.size === allKeys.length;
      if(isAllState){
        activeChannels = new Set([ch]);
      } else {
        if(activeChannels.has(ch)) activeChannels.delete(ch);
        else activeChannels.add(ch);
        if(activeChannels.size === 0) activeChannels = new Set(allKeys);
      }
      Object.entries(AUSSPIELUNG_META).forEach(([c, m])=>{
        chipEls[c].classList.toggle('active', activeChannels.has(c));
      });
      render();
    });
    ausspielungRowEl.appendChild(chip);
  });
}

// ---------- Right-side controls (Status / Nur gepickt) ----------
const rightControls = document.getElementById('rightControls');
function buildRightControls(){
  rightControls.innerHTML = '';
  if(activeTab==='sendeplan'){
    // Kein Status-Filter mehr noetig, da es nur noch Live-Uebertragungen gibt (keine Re-Lives).
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'simple-toggle';
    wrap.innerHTML = `
      <button data-v="all" class="active">Alle Spiele</button>
      <button data-v="picked">Nur im Sendeplan</button>`;
    wrap.addEventListener('click', (e)=>{
      const b = e.target.closest('button'); if(!b) return;
      wrap.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      pickedFilter = b.dataset.v;
      render();
    });
    rightControls.appendChild(wrap);
  }
}

// ---------- Team multi-select ----------
const teamBtn = document.getElementById('teamBtn');
const teamPanel = document.getElementById('teamPanel');
const teamList = document.getElementById('teamList');
const teamSearch = document.getElementById('teamSearch');
const teamChipsActive = document.getElementById('teamChipsActive');

function currentDataset(){
  if(activeTab==='sendeplan') return SENDEPLAN;
  return LEAGUES[activeTab];
}

function allTeamsForContext(){
  const set = new Set();
  currentDataset().forEach(e=>{ if(e.heim) set.add(e.heim); if(e.gast) set.add(e.gast); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'de'));
}

function buildTeamList(){
  const teams = allTeamsForContext();
  teamList.innerHTML = '';
  teams.forEach(team=>{
    const row = document.createElement('label');
    row.className = 'team-opt';
    row.innerHTML = `<input type="checkbox" value="${team}"> ${team}`;
    row.querySelector('input').addEventListener('change', (e)=>{
      if(e.target.checked) selectedTeams.add(team); else selectedTeams.delete(team);
      updateTeamUI();
      render();
    });
    teamList.appendChild(row);
  });
}

teamSearch.addEventListener('input', ()=>{
  const q = teamSearch.value.trim().toLowerCase();
  teamList.querySelectorAll('.team-opt').forEach(row=>{
    row.style.display = row.textContent.toLowerCase().includes(q) ? 'flex' : 'none';
  });
});

teamBtn.addEventListener('click', ()=>{ teamPanel.classList.toggle('open'); });
document.getElementById('teamDone').addEventListener('click', ()=> teamPanel.classList.remove('open'));
document.getElementById('teamClear').addEventListener('click', ()=>{
  selectedTeams = new Set();
  teamList.querySelectorAll('input').forEach(i=>i.checked=false);
  updateTeamUI(); render();
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.team-filter')) teamPanel.classList.remove('open');
});

function updateTeamUI(){
  const n = selectedTeams.size;
  document.getElementById('teamCountBadge').textContent = n>0 ? n : '';
  teamBtn.classList.toggle('has-selection', n>0);
  teamChipsActive.innerHTML = '';
  selectedTeams.forEach(team=>{
    const chip = document.createElement('div');
    chip.className = 'team-chip-active';
    chip.innerHTML = `${team} <button>&times;</button>`;
    chip.querySelector('button').addEventListener('click', ()=>{
      selectedTeams.delete(team);
      const cb = teamList.querySelector(`input[value="${CSS.escape(team)}"]`);
      if(cb) cb.checked = false;
      updateTeamUI(); render();
    });
    teamChipsActive.appendChild(chip);
  });
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('hidePlayed').addEventListener('change', (e)=>{
  hidePlayed = e.target.checked;
  render();
});

const legendEl = document.getElementById('legend');
Object.entries(SPORT_META).forEach(([sport, meta])=>{

  legendEl.appendChild(s);
});
const playedLegend = document.createElement('span');

legendEl.appendChild(playedLegend);

// ---------- Render ----------
function groupLabelSendeplan(e){
  const [wk, yr] = e.week.replace('KW','').split('/');
  return `KW ${wk} / ${yr}`;
}
function groupLabelLeague(e){
  if(e.date === '9999-99-99') return 'Termin offen';
  const [y,m] = e.date.split('-');
  const MONTHS = ['','Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  return `${MONTHS[parseInt(m,10)]} ${y}`;
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const main = document.getElementById('main');
  main.innerHTML = '';

  const isSendeplan = activeTab === 'sendeplan';
  const data = currentDataset();

  const filtered = data.filter(e=>{
    if(hidePlayed && isPlayed(e.date)) return false;
    if(isSendeplan){
      if(!activeSports.has(e.league)) return false;
      if(statusFilter !== 'all' && e.status !== statusFilter) return false;
      if(activeChannels.size < 4){
        const chans = e.ausspielung || [];
        if(!chans.some(c=>activeChannels.has(c))) return false;
      }
    } else {
      if(pickedFilter === 'picked' && !e.picked) return false;
    }
    if(selectedTeams.size > 0){
      if(!selectedTeams.has(e.heim) && !selectedTeams.has(e.gast)) return false;
    }
    if(q){
      const hay = `${e.heim} ${e.gast||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('countShown').textContent = filtered.length;
  document.getElementById('countTotal').textContent = data.length;

  if(filtered.length === 0){
    main.innerHTML = '<div class="empty">Keine Treffer für diese Auswahl. Filter anpassen oder Suche leeren.</div>';
    return;
  }

  let currentGroup = null;
  filtered.forEach(e=>{
    const groupKey = isSendeplan ? e.week : groupLabelLeague(e);
    if(groupKey !== currentGroup){
      currentGroup = groupKey;
      const gh = document.createElement('div');
      gh.className = 'group-header';
      gh.innerHTML = `<span>${isSendeplan ? groupLabelSendeplan(e) : groupKey}</span>`;
      main.appendChild(gh);
    }
    const sport = isSendeplan ? e.league : TABS.find(t=>t.id===activeTab).sport;
    const item = document.createElement('div');
    item.className = 'item' + (isPlayed(e.date) ? ' played' : '') + (editMode ? ' editable' : '');

    const [dd,mm] = (e.date_fmt||'').split('.');
    const dateHtml = e.date_fmt === 'Termin folgt'
      ? `<div class="wd">–</div><div class="dm" style="font-size:12px;">tba</div>`
      : `<div class="wd">${WD_ABBR[e.weekday]||''}</div><div class="dm">${dd}.${mm}.</div>`;

    const rightBadge = isSendeplan
      ? `<div class="badge ${e.status==='Live' ? 'live':'relive'}">${e.status==='Live'?'LIVE':'RE-LIVE'}</div>`
      : (e.picked ? `<div class="badge picked">SENDEPLAN</div>` : '');

    const channelsHtml = isSendeplan
      ? `<div class="row-channels">${(e.ausspielung||[]).map(ch => `<img src="${AUSSPIELUNG_META[ch].logo}" alt="${ch}" title="${ch}">`).join('')}</div>`
      : '<div class="row-channels"></div>';

    item.innerHTML = `
      <div class="datebox">${dateHtml}</div>
      <div class="time">${(e.uhrzeit||'').replace(' Uhr','')}</div>
      <div class="tag">${tagInnerHtml(sport, e.heim)}</div>
      <div class="matchup">
        ${!isSendeplan && e.picked ? '<span class="star">★</span>' : ''}
        <b>${e.heim}</b>${e.gast ? `<span class="vs">–</span>${e.gast}` : ''}
        ${e.result ? `<span class="result">${e.result}</span>` : (isPlayed(e.date) ? '<span class="played-mark">gelaufen</span>' : '')}
      </div>
      ${rightBadge}
      ${channelsHtml}
      ${editMode ? '<div class="edit-pencil">✎</div>' : ''}
    `;
    if(editMode){
      item.addEventListener('click', ()=> openEditForm(e, item, isSendeplan));
    }
    main.appendChild(item);
  });
}

// ---------- Bearbeiten-Modus ----------
let editMode = false;
const editToggleBtn = document.getElementById('editToggle');
const downloadBtn = document.getElementById('downloadBtn');

editToggleBtn.addEventListener('click', ()=>{
  editMode = !editMode;
  editToggleBtn.classList.toggle('active', editMode);
  editToggleBtn.textContent = editMode ? '✓ Bearbeiten aktiv' : '✎ Bearbeiten';
  downloadBtn.style.display = editMode ? 'inline-block' : 'none';
  render();
});

const WD_FROM_DATE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function isoWeekOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const target = new Date(d.valueOf());
  const dayNr = (d.getUTCDay() + 6) % 7;
  target.setUTCDate(target.getUTCDate() - dayNr + 3);
  const firstThursday = new Date(Date.UTC(target.getUTCFullYear(),0,4));
  const diff = target - firstThursday;
  return 1 + Math.round(diff / (7*24*60*60*1000));
}

function openEditForm(e, itemEl, isSendeplan){
  const form = document.createElement('div');
  form.className = 'edit-form';
  form.innerHTML = `
    <div class="edit-field"><label>Datum</label><input type="date" id="ef_date" value="${e.date}"></div>
    <div class="edit-field"><label>Uhrzeit</label><input type="text" id="ef_uhrzeit" value="${e.uhrzeit||''}"></div>
    <div class="edit-field"><label>Heim</label><input type="text" id="ef_heim" value="${e.heim||''}"></div>
    <div class="edit-field"><label>Gast</label><input type="text" id="ef_gast" value="${e.gast||''}"></div>
    <div class="edit-field"><label>Ergebnis</label><input type="text" id="ef_result" value="${e.result||''}" placeholder="z.B. 28:25"></div>
    <div class="edit-actions">
      <button class="edit-delete" id="ef_delete">Löschen</button>
      <button class="edit-cancel" id="ef_cancel">Abbrechen</button>
      <button class="edit-save" id="ef_save">Speichern</button>
    </div>
  `;
  itemEl.replaceWith(form);

  form.querySelector('#ef_cancel').addEventListener('click', ()=> render());
  form.querySelector('#ef_delete').addEventListener('click', ()=>{
    const arr = isSendeplan ? SENDEPLAN : LEAGUES[activeTab];
    const idx = arr.indexOf(e);
    if(idx > -1) arr.splice(idx, 1);
    render();
  });
  form.querySelector('#ef_save').addEventListener('click', ()=>{
    const newDate = form.querySelector('#ef_date').value;
    e.date = newDate;
    e.date_fmt = newDate.split('-').reverse().join('.');
    e.weekday = WD_FROM_DATE[new Date(newDate+'T00:00:00').getDay()];
    e.uhrzeit = form.querySelector('#ef_uhrzeit').value;
    e.heim = form.querySelector('#ef_heim').value;
    e.gast = form.querySelector('#ef_gast').value;
    const resultVal = form.querySelector('#ef_result').value.trim();
    if(resultVal) e.result = resultVal; else delete e.result;
    if(isSendeplan){
      const wk = isoWeekOf(newDate);
      const yr = new Date(newDate+'T00:00:00').getFullYear();
      e.week = `KW${String(wk).padStart(2,'0')}/${yr}`;
    }
    render();
  });
}

// ---------- Download der aktualisierten Datei ----------
downloadBtn.addEventListener('click', ()=>{
  let html = PRISTINE_HTML;
  html = html.replace(/const SENDEPLAN = \[[\s\S]*?\];\s*\nconst LEAGUES = \{[\s\S]*?\};/,
    `const SENDEPLAN = ${JSON.stringify(SENDEPLAN)};\nconst LEAGUES = ${JSON.stringify(LEAGUES)};`);
  html = '<!DOCTYPE html>\n' + html;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'index.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// ---------- Init ----------
if(new URLSearchParams(window.location.search).get('edit') === '1'){
  editToggleBtn.style.display = 'inline-block';
}
buildRightControls();
buildChips();
  buildAusspielungRow();
buildTeamList();
updateTeamUI();
render();
</script>
